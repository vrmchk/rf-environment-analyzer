[project]
name = "rfea-backend"
version = "0.1.0"
description = "Server part of the RF environment analyzer: Virtual Source, waterfall, detection, classification, event log"
requires-python = ">=3.14,<3.15"
dependencies = [
    "rfea-core",
    "numpy>=2.3",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "msgpack>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
